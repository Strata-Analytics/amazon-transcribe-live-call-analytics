name: Deploy to Dev

# ─── Cuándo corre ─────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - develop          # auto-deploy en cada merge a develop
    paths-ignore:
      - 'lca-ai-stack/source/ui/**'   # cambios solo del front no tocan infra

  workflow_dispatch:     # trigger manual desde GitHub Actions UI
    inputs:
      confirm:
        description: '¿Confirmar deploy? (escribir "deploy")'
        required: true

# ─── Variables globales ────────────────────────────────────────────────────────
env:
  STACK_NAME:      agent-copilot-dev
  REGION:          us-east-1
  CFN_BUCKET:      agent-copilot-dev-cfn-templates

  # Bucket público de AWS donde están los artefactos originales de LCA
  # (nested stacks que NO modificamos siguen apuntando acá)
  AWS_ARTIFACT_BUCKET: aws-ml-blog-us-east-1
  AWS_ARTIFACT_PREFIX: artifacts/lca

# ─────────────────────────────────────────────────────────────────────────────
jobs:
  deploy:
    name: 🚀 Deploy ${{ github.ref_name }} → agent-copilot-dev
    runs-on: ubuntu-latest
    environment: dev        # GitHub Environment → role ARN y protecciones de la cuenta dev

    # Permisos necesarios para OIDC — solicita token de identidad a GitHub
    permissions:
      id-token: write   # permite solicitar el JWT de OIDC
      contents: read    # permite el checkout del repo

    # Evita deploys paralelos sobre el mismo stack
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Credenciales AWS via OIDC (sin access keys de larga vida) ─────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.REGION }}

      # ── 3. Leer versión ──────────────────────────────────────────────────────
      - name: Read VERSION
        id: version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # ── 4. Subir sub-stack templates modificados ─────────────────────────────
      #   Estos templates tienen cambios nuestros (ej: tag aws-apn-id).
      #   Los subimos a nuestro bucket y luego apuntamos el main template acá.
      - name: Upload modified sub-stack templates to S3
        run: |
          echo "📦 Subiendo lca-vpc-stack..."
          aws s3 cp lca-vpc-stack/template.yaml \
            s3://${{ env.CFN_BUCKET }}/stacks/lca-vpc-stack/template.yaml \
            --region ${{ env.REGION }}

          echo "📦 Subiendo lca-chimevc-stack (template principal)..."
          aws s3 cp lca-chimevc-stack/template.yaml \
            s3://${{ env.CFN_BUCKET }}/stacks/lca-chimevc-stack/template.yaml \
            --region ${{ env.REGION }}

          echo "📦 Building + packaging lca-connect-kvs-stack..."
          cd lca-chimevc-stack/lambda_layers/node_transcriber_layer
          npm install --omit=dev
          mkdir -p nodejs
          cp -r node_modules nodejs/
          zip -r transcriber-layer.zip nodejs
          cd ../../../lca-connect-kvs-stack/lambda_functions/connect_kvs_consumer
          npm ci --omit=dev
          cd ../../..
          aws cloudformation package \
            --template-file lca-connect-kvs-stack/template.yaml \
            --s3-bucket ${{ env.CFN_BUCKET }} \
            --s3-prefix stacks/lca-connect-kvs-stack/lambda \
            --output-template-file /tmp/lca-connect-kvs-packaged.yaml \
            --region ${{ env.REGION }}
          aws s3 cp /tmp/lca-connect-kvs-packaged.yaml \
            s3://${{ env.CFN_BUCKET }}/stacks/lca-connect-kvs-stack/template.yaml \
            --region ${{ env.REGION }}

          echo "📦 Building + packaging lca-websocket-transcriber-stack..."
          pip install \
            -r lca-websocket-transcriber-stack/source/lambda_functions/start_codebuild/requirements.txt \
            -t lca-websocket-transcriber-stack/source/lambda_functions/start_codebuild/
          cd lca-websocket-transcriber-stack/source/lambda_functions/pca_integration
          npm ci --omit=dev
          cd ../../../..
          cd lca-websocket-transcriber-stack/deployment
          aws cloudformation package \
            --template-file lca-websocket-transcriber.yaml \
            --s3-bucket ${{ env.CFN_BUCKET }} \
            --s3-prefix stacks/lca-websocket-transcriber-stack/lambda \
            --output-template-file /tmp/lca-websocket-transcriber-packaged.yaml \
            --region ${{ env.REGION }}
          cd ../..
          aws s3 cp /tmp/lca-websocket-transcriber-packaged.yaml \
            s3://${{ env.CFN_BUCKET }}/stacks/lca-websocket-transcriber-stack/template.yaml \
            --region ${{ env.REGION }}

          echo "✅ Sub-stacks subidos."

      # ── 5. Procesar lca-main.yaml ─────────────────────────────────────────────
      #   a) Reemplaza los <TOKENS> con los valores reales
      #   b) Redirige las TemplateURLs de los stacks que modificamos
      #      para que apunten a nuestro bucket en vez del de AWS
      - name: Process lca-main.yaml
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          REGION="${{ env.REGION }}"
          AWS_BUCKET="${{ env.AWS_ARTIFACT_BUCKET }}"
          AWS_PREFIX="${{ env.AWS_ARTIFACT_PREFIX }}"
          OUR_BUCKET="${{ env.CFN_BUCKET }}"

          echo "🔄 Reemplazando tokens..."
          sed \
            -e "s|<REGION_TOKEN>|${REGION}|g" \
            -e "s|<ARTIFACT_BUCKET_TOKEN>|${AWS_BUCKET}|g" \
            -e "s|<ARTIFACT_PREFIX_TOKEN>|${AWS_PREFIX}|g" \
            -e "s|<VERSION_TOKEN>|${VERSION}|g" \
            lca-main.yaml > /tmp/lca-main-processed.yaml

          echo "🔀 Redirigiendo sub-stacks modificados a nuestro bucket..."

          # vpc-stack → nuestro bucket
          AWS_VPC="https://s3.${REGION}.amazonaws.com/${AWS_BUCKET}/${AWS_PREFIX}/lca-vpc-stack/template.yaml"
          OUR_VPC="https://s3.${REGION}.amazonaws.com/${OUR_BUCKET}/stacks/lca-vpc-stack/template.yaml"
          sed -i "s|${AWS_VPC}|${OUR_VPC}|g" /tmp/lca-main-processed.yaml

          # chimevc-stack → nuestro bucket
          AWS_CHIME="https://s3.${REGION}.amazonaws.com/${AWS_BUCKET}/${AWS_PREFIX}/lca-chimevc-stack/template.yaml"
          OUR_CHIME="https://s3.${REGION}.amazonaws.com/${OUR_BUCKET}/stacks/lca-chimevc-stack/template.yaml"
          sed -i "s|${AWS_CHIME}|${OUR_CHIME}|g" /tmp/lca-main-processed.yaml

          # connect-kvs-stack → nuestro bucket (URL includes VERSION)
          AWS_CONNECT="https://s3.${REGION}.amazonaws.com/${AWS_BUCKET}/${AWS_PREFIX}/${VERSION}/lca-connect-kvs-stack/template.yaml"
          OUR_CONNECT="https://s3.${REGION}.amazonaws.com/${OUR_BUCKET}/stacks/lca-connect-kvs-stack/template.yaml"
          sed -i "s|${AWS_CONNECT}|${OUR_CONNECT}|g" /tmp/lca-main-processed.yaml

          # websocket-transcriber-stack → nuestro bucket (VERSION appears twice in path)
          AWS_WS="https://s3.${REGION}.amazonaws.com/${AWS_BUCKET}/${AWS_PREFIX}/${VERSION}/lca-websocket-transcriber-stack/${VERSION}/template.yaml"
          OUR_WS="https://s3.${REGION}.amazonaws.com/${OUR_BUCKET}/stacks/lca-websocket-transcriber-stack/template.yaml"
          sed -i "s|${AWS_WS}|${OUR_WS}|g" /tmp/lca-main-processed.yaml

          echo "✅ Template procesado."

      # ── 6. Validar template ───────────────────────────────────────────────────
      - name: Upload and validate main template
        run: |
          TEMPLATE_S3="s3://${{ env.CFN_BUCKET }}/lca-main.yaml"
          TEMPLATE_URL="https://s3.${{ env.REGION }}.amazonaws.com/${{ env.CFN_BUCKET }}/lca-main.yaml"

          echo "⬆️  Subiendo lca-main.yaml procesado..."
          aws s3 cp /tmp/lca-main-processed.yaml "$TEMPLATE_S3" --region ${{ env.REGION }}

          echo "✅ Validando template en CloudFormation..."
          aws cloudformation validate-template \
            --template-url "$TEMPLATE_URL" \
            --region ${{ env.REGION }} > /dev/null

          echo "TEMPLATE_URL=${TEMPLATE_URL}" >> "$GITHUB_ENV"

      # ── 7. Deploy ─────────────────────────────────────────────────────────────
      - name: Deploy CloudFormation stack
        run: |
          echo "🚀 Deployando ${{ env.STACK_NAME }}..."

          # Construir parameter overrides desde el JSON de parámetros
          # Excluye valores enmascarados (****) — CloudFormation usa el valor anterior
          # Se usa array para manejar correctamente valores con espacios (ej: "Amazon Connect")
          mapfile -t PARAMS < <(jq -r \
            '.[] | select(.ParameterValue != "****") | .ParameterKey + "=" + .ParameterValue' \
            strata-deploy-to-dev/lca-stack-parameters-dev.json)

          # Inject secrets that are masked (****) in the parameters file
          PARAMS+=("DeepgramApiKey=${{ secrets.DEEPGRAM_API_KEY }}")

          aws cloudformation deploy \
            --region         ${{ env.REGION }} \
            --template-file  /tmp/lca-main-processed.yaml \
            --s3-bucket      ${{ env.CFN_BUCKET }} \
            --s3-prefix      cfn-deploy \
            --stack-name     ${{ env.STACK_NAME }} \
            --parameter-overrides "${PARAMS[@]}" \
            --capabilities   CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset

      # ── 8. Build y push imagen Docker del WebSocket transcriber ─────────────
      # CodeBuild descarga el ZIP original de AWS → no incluye nuestro código.
      # Construimos la imagen aquí y la empujamos a ECR con el mismo tag 0.9.7
      # que usa la task definition (creada por CodeBuild en el deploy original).
      - name: Build and push WebSocket transcriber Docker image
        run: |
          ECR_REPO="637423400532.dkr.ecr.${{ env.REGION }}.amazonaws.com/agent-copilot-dev-websockettranscriberstack-s8jaumn51c6k-transcriberecrrepository-wq0jboagdpf2"
          IMAGE_TAG="0.9.7"
          CLUSTER="agent-copilot-dev-WEBSOCKETTRANSCRIBERSTACK-S8JAUMN51C6K-TranscribingCluster-9mFxfNrAsgO1"
          SERVICE="agent-copilot-dev-WEBSOCKETTRANSCRIBERSTACK-S8JAUMN51C6K-TranscriberWebsocketFargateService-HfLvEET8Sbx8"

          echo "🔑 Autenticando en ECR..."
          aws ecr get-login-password --region ${{ env.REGION }} | \
            docker login --username AWS --password-stdin 637423400532.dkr.ecr.${{ env.REGION }}.amazonaws.com

          echo "🐳 Building Docker image..."
          docker build -t "${ECR_REPO}:${IMAGE_TAG}" \
            lca-websocket-transcriber-stack/source/app/

          echo "⬆️  Pushing to ECR..."
          docker push "${ECR_REPO}:${IMAGE_TAG}"

          echo "🔄 Forcing ECS service redeployment..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --region ${{ env.REGION }} > /dev/null

          echo "✅ Imagen pushed y servicio ECS actualizado."

      # ── 9. Actualizar call_event_processor Lambda directamente ──────────────
      # La AI stack se despliega desde el bucket público de AWS (lca-ai-stack no
      # se re-empaqueta en CI para evitar actualizar AppSync/IAM/etc. inadvertidamente).
      # En cambio, actualizamos directamente solo la función que modificamos.
      - name: Deploy call_event_processor Lambda code
        run: |
          echo "🔍 Buscando nombre del Lambda call_event_processor..."

          AI_STACK=$(aws cloudformation describe-stack-resource \
            --stack-name ${{ env.STACK_NAME }} \
            --logical-resource-id AISTACK \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text \
            --region ${{ env.REGION }})

          LAMBDA_FN=$(aws cloudformation describe-stack-resource \
            --stack-name "$AI_STACK" \
            --logical-resource-id CallEventProcessorFunction \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text \
            --region ${{ env.REGION }})

          echo "Lambda function: $LAMBDA_FN"

          echo "📦 Empaquetando call_event_processor..."
          cd lca-ai-stack/source/lambda_functions/call_event_processor
          zip -r /tmp/call-event-processor.zip . -x "*.pyc" -x "__pycache__/*"
          cd ../../../..

          echo "⬆️  Actualizando código Lambda..."
          aws lambda update-function-code \
            --function-name "$LAMBDA_FN" \
            --zip-file fileb:///tmp/call-event-processor.zip \
            --region ${{ env.REGION }} \
            --output text

          echo "✅ call_event_processor actualizado."

      # ── 11. Diagnóstico en caso de fallo ─────────────────────────────────────
      - name: CloudFormation failure diagnostics
        if: failure()
        run: |
          echo "════════════════════════════════════════════"
          echo "  ❌ Stack events (últimos 30)"
          echo "════════════════════════════════════════════"
          aws cloudformation describe-stack-events \
            --stack-name ${{ env.STACK_NAME }} \
            --region     ${{ env.REGION }} \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`ROLLBACK_IN_PROGRESS`].[Timestamp,ResourceType,LogicalResourceId,ResourceStatusReason]' \
            --output table \
          || aws cloudformation describe-stack-events \
            --stack-name ${{ env.STACK_NAME }} \
            --region     ${{ env.REGION }} \
            --query 'StackEvents[:30].[Timestamp,ResourceStatus,ResourceType,LogicalResourceId,ResourceStatusReason]' \
            --output table

      # ── 12. Resumen ───────────────────────────────────────────────────────────
      - name: Deploy summary
        if: success()
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "  ✅ Deploy exitoso"
          echo "  Stack  : ${{ env.STACK_NAME }}"
          echo "  Rama   : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  Región : ${{ env.REGION }}"
          echo "════════════════════════════════════════════"
