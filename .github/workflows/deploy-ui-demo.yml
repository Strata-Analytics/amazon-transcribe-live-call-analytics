name: Deploy UI to Demo

on:
  push:
    branches:
      - demo
    paths:
      - 'lca-ai-stack/source/ui/**'

  workflow_dispatch:

env:
  STACK_NAME: agent-copilot-demo
  REGION:     us-east-1
  UI_DIR:     lca-ai-stack/source/ui

jobs:
  deploy-ui:
    name: 🎨 Deploy UI → agent-copilot-demo
    runs-on: ubuntu-latest
    environment: demo

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: deploy-ui-demo
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.REGION }}

      - name: Get config from CloudFormation
        id: cfn
        run: |
          AISTACK_ID=$(aws cloudformation describe-stack-resources \
            --stack-name ${{ env.STACK_NAME }} \
            --logical-resource-id AISTACK \
            --query "StackResources[0].PhysicalResourceId" \
            --output text)

          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$AISTACK_ID" \
            --query "Stacks[0].Outputs" \
            --output json)

          get_output() {
            echo "$OUTPUTS" | jq -r --arg key "$1" '.[] | select(.OutputKey==$key) | .OutputValue'
          }

          S3_BUCKET=$(get_output "WebAppBucket")
          CF_ID=$(get_output "CloudFrontDistributionId")
          CF_DOMAIN=$(get_output "CloudFrontDomainName")
          LOCAL_UI_ENV=$(get_output "LocalUITestingEnv")

          echo "S3_BUCKET=$S3_BUCKET" >> "$GITHUB_OUTPUT"
          echo "CF_ID=$CF_ID"         >> "$GITHUB_OUTPUT"
          echo "CF_DOMAIN=$CF_DOMAIN" >> "$GITHUB_OUTPUT"

          echo "$LOCAL_UI_ENV" | tr ' ' '\n' > /tmp/react-env
          echo "REACT_APP_CLOUDFRONT_DOMAIN=https://${CF_DOMAIN}/" >> /tmp/react-env
          echo "REACT_APP_SHOULD_HIDE_SIGN_UP=true"                >> /tmp/react-env
          echo "REACT_APP_AGENT_CHAT_URL=${{ vars.AGENT_CHAT_URL_DEMO }}" >> /tmp/react-env

          echo "ℹ️  Bucket     : $S3_BUCKET"
          echo "ℹ️  CloudFront : $CF_ID"
          echo "ℹ️  Domain     : $CF_DOMAIN"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ env.UI_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.UI_DIR }}
        run: npm ci

      - name: Build UI
        working-directory: ${{ env.UI_DIR }}
        env:
          DISABLE_ESLINT_PLUGIN: true
        run: |
          cp /tmp/react-env .env.local
          npm run build

      - name: Upload to S3
        working-directory: ${{ env.UI_DIR }}
        run: |
          aws s3 sync build/ s3://${{ steps.cfn.outputs.S3_BUCKET }} \
            --delete \
            --region ${{ env.REGION }}

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cfn.outputs.CF_ID }} \
            --paths "/*"

      - name: Deploy summary
        if: success()
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "  ✅ UI Deploy exitoso"
          echo "  Stack  : ${{ env.STACK_NAME }}"
          echo "  Rama   : ${{ github.ref_name }}"
          echo "  Commit : ${{ github.sha }}"
          echo "  URL    : https://${{ steps.cfn.outputs.CF_DOMAIN }}"
          echo "════════════════════════════════════════════"
